when:
  - event: push
    branch:
      - protonvpn-next-dev
      - awgbox
  - event: tag
  - event: manual

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 0

steps:
  build-android:
    image: ghcr.io/cirruslabs/android-sdk:36
    environment:
      ANDROID_HOME: /opt/android-sdk-linux
      SIGNING_KEY_BASE64:
        from_secret: SIGNING_KEY_BASE64
      SIGNING_STORE_PASSWORD:
        from_secret: SIGNING_STORE_PASSWORD
      SIGNING_KEY_ALIAS:
        from_secret: SIGNING_KEY_ALIAS
      SIGNING_KEY_PASSWORD:
        from_secret: SIGNING_KEY_PASSWORD
      SENTRY_AUTH_TOKEN:
        from_secret: SENTRY_AUTH_TOKEN
      SENTRY_ORG:
        from_secret: SENTRY_ORG
      SENTRY_PROJECT:
        from_secret: SENTRY_PROJECT
    commands:
      # 1. Force update sdkmanager and install Android 37.1, NDK and CMake.
      #    The 37.1 minor platform is required: compileSdk = 37 / compileSdkMinor = 1,
      #    because tor-android 0.4.9.12 is published against 37.1.
      - yes | sdkmanager --licenses > /dev/null
      - sdkmanager --update
      - sdkmanager "platforms;android-37.1" "build-tools;37.0.0" "platform-tools" "ndk;29.0.14206865" "cmake;3.22.1"

      # 2. Build the generated AWGBox dependency when it is not restored/present
      - |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends ca-certificates curl git python3
        rm -rf /usr/local/go
        # Keep the Go version literal because Woodpecker expands variables before step execution.
        curl -fsSL "https://go.dev/dl/go1.26.4.linux-amd64.tar.gz" | tar -C /usr/local -xz
        export PATH="/usr/local/go/bin:$PATH"
        go version
        ./scripts/build-awgbox-lib.sh

      # 3. Prepare Git metadata
      - git fetch --unshallow || true
      - git fetch --tags
      - 'echo "Current commit count: $(git rev-list --count HEAD)"'

      # 4. Setup Keystore
      - echo $SIGNING_KEY_BASE64 | base64 -d > app/release.keystore
      - chmod +x gradlew
      - export SIGNING_KEY_FILE=release.keystore

      # 5. Build APKs and Run Tests based on flavor
      - |
        if [ -n "$CI_COMMIT_TAG" ]; then
          ./gradlew testStableStandardDebugUnitTest assembleStableStandardRelease
          ./gradlew assembleStablePrivacyRelease
        else
          ./gradlew testNightlyStandardDebugUnitTest assembleNightlyStandardDebug assembleNightlyStandardRelease
          ./gradlew testNightlyPrivacyDebugUnitTest assembleNightlyPrivacyDebug assembleNightlyPrivacyRelease
        fi

      # 6. Generate SHA256 Checksums
      - find app/build/outputs/apk/ -name "*.apk" -exec sh -c 'sha256sum "$1" > "$1.sha256"' _ {} \;

  generate-changelog:
    image: python:3.11-slim
    when:
      event: tag
    environment:
      GEMINI_API_KEY:
        from_secret: GEMINI_API_KEY
      CHANGELOG_PROMPT:
        from_secret: CHANGELOG_PROMPT
      GEMINI_MODEL:
        from_secret: GEMINI_MODEL
    commands:
      - apt-get update && apt-get install -y git
      - git fetch --tags
      - pip install google-generativeai
      - python scripts/generate_ai_changelog.py

  publish-release:
    image: woodpeckerci/plugin-release
    when:
      event: tag
      ref: 'regex:^refs/tags/[0-9]+\.[0-9]+\.[0-9]+$'
    settings:
      api_key:
        from_secret: CODEBERG_TOKEN
      files:
        - app/build/outputs/apk/stableStandard/release/*.apk
        - app/build/outputs/apk/stableStandard/release/*.sha256
        - app/build/outputs/apk/stablePrivacy/release/*.apk
        - app/build/outputs/apk/stablePrivacy/release/*.sha256
      note: changelog.txt
      title: "Release ${CI_COMMIT_TAG}"
      prerelease: false

  publish-pre-release:
    image: woodpeckerci/plugin-release
    when:
      event: tag
      ref: 
        exclude: 'regex:^refs/tags/[0-9]+\.[0-9]+\.[0-9]+$'
    settings:
      api_key:
        from_secret: CODEBERG_TOKEN
      files:
        - app/build/outputs/apk/stableStandard/release/*.apk
        - app/build/outputs/apk/stableStandard/release/*.sha256
        - app/build/outputs/apk/stablePrivacy/release/*.apk
        - app/build/outputs/apk/stablePrivacy/release/*.sha256
      note: changelog.txt
      title: "Pre-release ${CI_COMMIT_TAG}"
      prerelease: true

  publish-ota:
    image: python:3.11-slim
    environment:
      R2_ACCESS_KEY:
        from_secret: R2_ACCESS_KEY
      R2_SECRET_KEY:
        from_secret: R2_SECRET_KEY
      R2_ENDPOINT:
        from_secret: R2_ENDPOINT
      R2_BUCKET:
        from_secret: R2_BUCKET
      R2_PUBLIC_URL:
        from_secret: R2_PUBLIC_URL
      CODEBERG_TOKEN:
        from_secret: CODEBERG_TOKEN
      GITHUB_TOKEN:
        from_secret: GITHUB_TOKEN
    commands:
      - apt-get update && apt-get install -y git
      - pip install boto3
      - python scripts/publish_ota.py

  upload-telegram:
    image: python:3.11-slim
    environment:
      TG_API_ID:
        from_secret: TG_API_ID
      TG_API_HASH:
        from_secret: TG_API_HASH
      TG_BOT_TOKEN:
        from_secret: TG_BOT_TOKEN
      TG_CHAT_ID:
        from_secret: TG_CHAT_ID
    commands:
      - apt-get update && apt-get install -y git
      - pip install telethon
      - python scripts/upload_telegram.py
