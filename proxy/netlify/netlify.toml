# Netlify configuration for the Proton API CORS proxy.
# Everything is served by the single catch-all function; there is no real site.

[build]
  functions = "netlify/functions"
  publish = "public"

[functions]
  node_bundler = "esbuild"

# No redirect here on purpose. The function is a v2 function that declares
# `config = { path: "/*" }`, so Netlify already routes every request to it with
# the original URL intact. A `/.netlify/functions/proxy/:splat` rewrite would
# additionally prepend that internal prefix to the path, and the proxy would
# forward it to Proton as `/.netlify/functions/proxy/vpn/v2/logicals`.
