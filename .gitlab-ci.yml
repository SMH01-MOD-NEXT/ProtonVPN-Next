# GitLab CI/CD for ProtonVPN-Next
# Leveraging GitLab Ultimate for Security Scanning

stages:
  - pre-flight
  - test
  - security
  - build
  - deploy

variables:
  ANDROID_SDK_IMAGE: "ghcr.io/cirruslabs/android-sdk:36"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Xmx4g"
  GRADLE_USER_HOME: "${CI_PROJECT_DIR}/.gradle"
  SECURE_LOG_LEVEL: "debug" # Helps debugging failures
  DS_SKIP_DEPENDENCY_CHECKING: "true" # Skips Gradle execution, just parses files
  # Full history + tags, like Woodpecker's `depth: 0`. The OTA versionCode is derived from
  # `git rev-list --count HEAD`, so a shallow clone publishes a lower version than the previous build.
  GIT_DEPTH: "0"
  GIT_FETCH_EXTRA_FLAGS: "--tags --force"

# Pre-flight check for secrets and external services
verify-secrets:
  stage: pre-flight
  image: python:3.11-slim
  tags:
    - saas-linux-small-amd64
  cache: {}
  script:
    - apt-get update && apt-get install -y curl
    - pip install boto3 botocore
    - |
      echo "Verifying Cloudflare R2 access..."
      python3 -c "
      import boto3, os, sys
      from botocore.config import Config
      try:
          s3 = boto3.client('s3',
              endpoint_url=os.environ['R2_ENDPOINT'],
              aws_access_key_id=os.environ['R2_ACCESS_KEY'],
              aws_secret_access_key=os.environ['R2_SECRET_KEY'],
              config=Config(signature_version='s3v4'),
              region_name='auto'
          )
          s3.head_bucket(Bucket=os.environ['R2_BUCKET'])
          print('✅ R2 access verified')
      except Exception as e:
          print(f'❌ R2 access failed: {e}')
          sys.exit(1)
      "
    - |
      echo "Verifying Telegram Bot Token..."
      TG_RESP=$(curl -s "https://api.telegram.org/bot${TG_BOT_TOKEN}/getMe")
      if echo "$TG_RESP" | grep -q '"ok":true'; then
        echo "✅ Telegram Bot Token verified"
      else
        echo "❌ Telegram Bot Token invalid: $TG_RESP"
        exit 1
      fi
    - |
      echo "Verifying website push token..."
      # CI_JOB_TOKEN can clone but is always rejected on push, which silently froze the
      # website repository and let the mirror drift one commit ahead forever.
      # The website now lives in its own project, so the token must be scoped to
      # that project rather than to this one.
      WEBSITE_REPO="${WEBSITE_REPO:-vpn-next-group/ProtonVPN-Next-WEB}"
      WEBSITE_BRANCH="${WEBSITE_BRANCH:-main}"
      PUSH_TOKEN="${GITLAB_TOKEN:-${WEBSITE_PUSH_TOKEN:-$CI_PUSH_TOKEN}}"
      if [ -z "$PUSH_TOKEN" ]; then
        echo "❌ No GITLAB_TOKEN/WEBSITE_PUSH_TOKEN set. OTA metadata cannot be pushed to $WEBSITE_REPO."
        exit 1
      fi
      WEBSITE_REPO_ENCODED=$(echo "$WEBSITE_REPO" | sed 's|/|%2F|g')
      WEBSITE_RESP=$(curl -s -o /dev/null -w "%{http_code}" \
        -H "PRIVATE-TOKEN: $PUSH_TOKEN" \
        "${CI_API_V4_URL}/projects/${WEBSITE_REPO_ENCODED}/repository/branches/${WEBSITE_BRANCH}")
      if [ "$WEBSITE_RESP" = "200" ]; then
        echo "✅ $WEBSITE_REPO ($WEBSITE_BRANCH) reachable with the push token"
      else
        echo "❌ Push token cannot read $WEBSITE_REPO branch $WEBSITE_BRANCH (HTTP $WEBSITE_RESP). It needs 'write_repository' scope on that project."
        exit 1
      fi
    - |
      echo "Verifying GitHub mirror token..."
      # The token pushes OTA metadata to the website mirror, so that is the
      # repository whose access has to be verified here.
      if [ -n "$GITHUB_TOKEN" ]; then
        MIRROR_REPO="${MIRROR_REPO:-SMH01-MIRRORS/ProtonVPN-Next-WEB}"
        GH_RESP=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $GITHUB_TOKEN" \
          "https://api.github.com/repos/${MIRROR_REPO}")
        if [ "$GH_RESP" = "200" ]; then
          echo "✅ GitHub mirror token verified"
        else
          echo "❌ GitHub mirror token invalid (HTTP $GH_RESP)"
          exit 1
        fi
      else
        echo "⚠️ GITHUB_TOKEN not set, mirror will be skipped..."
      fi
    - |
      echo "Verifying Sentry Auth Token..."
      if [ -n "$SENTRY_AUTH_TOKEN" ]; then
        SENTRY_RESP=$(curl -s -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" "https://sentry.io/api/0/")
        if echo "$SENTRY_RESP" | grep -q '"user":'; then
          echo "✅ Sentry Auth Token verified"
        else
          echo "❌ Sentry Auth Token invalid or insufficient permissions: $SENTRY_RESP"
          exit 1
        fi
      else
        echo "⚠️ SENTRY_AUTH_TOKEN not set, skipping..."
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "manual"

# Caching for Gradle and Android SDK components
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .gradle/wrapper
    - .gradle/caches
    - .android/
    - .android-sdk/

# GitLab Ultimate Security Scans
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml

# Dependency Scanning configuration specifically for Android
dependency_scanning:
  tags:
    - saas-linux-medium-amd64
  variables:
    DS_SKIP_DEPENDENCY_CHECKING: "true"
    SKIP_AWGBOX_BUILD: "true"
  before_script:
    - |
      echo "Ensuring JDK 21 is installed..."
      if ! command -v java >/dev/null || ! java -version 2>&1 | grep -q "21"; then
        echo "Java 21 not found or incorrect version. Installing openjdk-21-jdk-headless..."
        if command -v apt-get >/dev/null; then
          apt-get update -qq && apt-get install -y -qq openjdk-21-jdk-headless > /dev/null
          export JAVA_HOME="/usr/lib/jvm/java-21-openjdk-amd64"
        elif command -v microdnf >/dev/null; then
          microdnf install -y java-21-openjdk-devel > /dev/null
          export JAVA_HOME="/usr/lib/jvm/java-21"
        elif command -v yum >/dev/null; then
          yum install -y java-21-openjdk-devel > /dev/null
          export JAVA_HOME="/usr/lib/jvm/java-21"
        elif command -v apk >/dev/null; then
          apk add openjdk21-jdk > /dev/null
          export JAVA_HOME="/usr/lib/jvm/java-21-openjdk"
        fi
        export PATH="$JAVA_HOME/bin:$PATH"
      fi
      java -version
    - export ANDROID_HOME="${CI_PROJECT_DIR}/.android-sdk"
    - export ANDROID_SDK_ROOT="$ANDROID_HOME"
    - mkdir -p "$ANDROID_HOME"
    - export PATH="${HOME}/.local/bin:${PATH}"
    - |
      if ! command -v android >/dev/null; then
        echo "Installing modern Android CLI (2026)..."
        if command -v apt-get >/dev/null; then
          apt-get update -qq && apt-get install -y -qq curl unzip git > /dev/null
        fi
        curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
      fi
    - android --sdk="$ANDROID_HOME" init
    - android --sdk="$ANDROID_HOME" sdk install "platforms/android-37.0" "platforms/android-24" "build-tools/37.0.0" --canary
    - ./gradlew help

.android-setup:
  image: $ANDROID_SDK_IMAGE
  before_script:
    - |
      echo "Ensuring JDK 21 is installed..."
      if ! command -v java >/dev/null || ! java -version 2>&1 | grep -q "21"; then
        echo "Java 21 not found or incorrect version. Installing openjdk-21-jdk-headless..."
        if command -v apt-get >/dev/null; then
          apt-get update -qq && apt-get install -y -qq openjdk-21-jdk-headless > /dev/null
          export JAVA_HOME="/usr/lib/jvm/java-21-openjdk-amd64"
        elif command -v microdnf >/dev/null; then
          microdnf install -y java-21-openjdk-devel > /dev/null
          export JAVA_HOME="/usr/lib/jvm/java-21"
        elif command -v yum >/dev/null; then
          yum install -y java-21-openjdk-devel > /dev/null
          export JAVA_HOME="/usr/lib/jvm/java-21"
        elif command -v apk >/dev/null; then
          apk add openjdk21-jdk > /dev/null
          export JAVA_HOME="/usr/lib/jvm/java-21-openjdk"
        fi
        export PATH="$JAVA_HOME/bin:$PATH"
      fi
    - export ANDROID_HOME="${CI_PROJECT_DIR}/.android-sdk"
    - export ANDROID_SDK_ROOT="$ANDROID_HOME"
    - mkdir -p "$ANDROID_HOME"
    - export PATH="${HOME}/.local/bin:${PATH}"
    - |
      if ! command -v android >/dev/null; then
        echo "Installing modern Android CLI (2026)..."
        curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
      fi
    - android --sdk="$ANDROID_HOME" init
    - android --sdk="$ANDROID_HOME" sdk install "platforms/android-37.0" "platforms/android-24" "build-tools/37.0.0" --canary
    - android --sdk="$ANDROID_HOME" sdk install "ndk/29.0.14206865" "cmake/3.22.1" --canary
    # Install Go for AWGBox
    - |
      if [ ! -d "/usr/local/go" ]; then
        echo "Installing Go..."
        curl -fsSL "https://go.dev/dl/go1.26.4.linux-amd64.tar.gz" | tar -C /usr/local -xz
      fi
    - export PATH="/usr/local/go/bin:$PATH"
    - ./scripts/build-awgbox-lib.sh
    # Git metadata
    - git fetch --unshallow || true
    - git fetch --tags
    # Keystore setup
    - echo "$SIGNING_KEY_BASE64" | base64 -d > app/release.keystore
    - export SIGNING_KEY_FILE=release.keystore
    - chmod +x gradlew

unit-tests:
  extends: .android-setup
  stage: test
  tags:
    - saas-linux-medium-amd64
  variables:
    GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Xmx8g"
  script:
    - ./gradlew testNightlyStandardDebugUnitTest
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "manual"

build-apks:
  extends: .android-setup
  stage: build
  tags:
    - saas-linux-medium-amd64
  variables:
    GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Xmx8g"
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        ./gradlew assembleStableStandardRelease
        ./gradlew assembleStablePrivacyRelease
      else
        ./gradlew assembleNightlyStandardDebug assembleNightlyStandardRelease
        ./gradlew assembleNightlyPrivacyDebug assembleNightlyPrivacyRelease
      fi
    # Generate Checksums
    - find app/build/outputs/apk/ -name "*.apk" -exec sh -c 'sha256sum "$1" > "$1.sha256"' _ {} \;
  artifacts:
    paths:
      - app/build/outputs/apk/**/*.apk
      - app/build/outputs/apk/**/*.sha256
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "protonvpn-next-dev" || $CI_COMMIT_BRANCH == "awgbox"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "manual"

generate-changelog:
  stage: deploy
  tags:
    - saas-linux-small-amd64
  image: python:3.11-slim
  cache: {}
  script:
    - apt-get update && apt-get install -y git
    - git fetch --tags
    - pip install google-generativeai
    - python scripts/generate_ai_changelog.py
  artifacts:
    paths:
      - changelog.txt
  rules:
    - if: $CI_COMMIT_TAG

create-official-release:
  stage: deploy
  tags:
    - saas-linux-small-amd64
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  cache: {}
  needs:
    - job: build-apks
    - job: generate-changelog
  script:
    - echo "Creating official release for $CI_COMMIT_TAG"
  release:
    name: 'Official Release $CI_COMMIT_TAG'
    description: '$(cat changelog.txt)'
    tag_name: '$CI_COMMIT_TAG'
    assets:
      links:
        - name: 'Standard Release APK'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/app/build/outputs/apk/stableStandard/release/app-stable-standard-release.apk?job=build-apks'
        - name: 'Privacy Release APK'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/app/build/outputs/apk/stablePrivacy/release/app-stable-privacy-release.apk?job=build-apks'
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'

create-pre-release:
  stage: deploy
  tags:
    - saas-linux-small-amd64
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  cache: {}
  needs:
    - job: build-apks
    - job: generate-changelog
  script:
    - echo "Creating pre-release for $CI_COMMIT_TAG"
  release:
    name: 'Pre-release $CI_COMMIT_TAG'
    description: '$(cat changelog.txt)'
    tag_name: '$CI_COMMIT_TAG'
    assets:
      links:
        - name: 'Standard Pre-release APK'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/app/build/outputs/apk/stableStandard/release/app-stable-standard-release.apk?job=build-apks'
        - name: 'Privacy Pre-release APK'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/app/build/outputs/apk/stablePrivacy/release/app-stable-privacy-release.apk?job=build-apks'
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+-.+$/'

publish-external:
  stage: deploy
  tags:
    - saas-linux-small-amd64
  image: python:3.11-slim
  cache: {}
  needs:
    - job: build-apks
    - job: generate-changelog
      optional: true
  variables:
    GIT_DEPTH: "0"
  script:
    - apt-get update && apt-get install -y git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    # publish_ota.py needs the full history for the versionCode and the tags for the versionName
    - git fetch --unshallow || true
    - git fetch --tags --force
    - pip install boto3 telethon
    - python scripts/publish_ota.py
    - python scripts/upload_telegram.py
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "protonvpn-next-dev" || $CI_COMMIT_BRANCH == "awgbox"
    - if: $CI_PIPELINE_SOURCE == "manual"
      when: manual
